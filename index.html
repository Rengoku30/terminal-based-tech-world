<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="monitor">
        <div class="monitor-case">
            <div class="screen-surround">
                <div class="screen">
                    <div class="crt-overlay"></div>
                    <div class="terminal">
                        <div id="output"></div>
                        <div class="input-line">
                            <span class="prompt">visitor@tech-terminal:~$</span>
                            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
                        </div>
                    </div>
                </div>
            </div>
            <div class="logo">TECH-TRON 3000</div>
            <div class="power-button"></div>
            <div class="power-led"></div>
        </div>
        <div class="monitor-stand"></div>
        <div class="monitor-base"></div>
    </div>
    <script src="script.js"></script>
    <script defer src="https://cdn.vercel-analytics.com/v1/script.js"></script>
</body>

</html>
